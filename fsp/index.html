<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="description" content="FSP-Simulator Berlin: Fachsprachprüfung mit KI-Patient, Arztbrief und KI-Oberärztin üben – Spracheingabe und KI laufen lokal im Browser."><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FSP Simulator Berlin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a hospital information system (KIS) — dark module rail on the left, toolbar on top, a patient header band, then the working module. */
:root{
  --bg:#e9edf2; --panel:#ffffff; --panel-2:#f4f6f9; --ink:#14202b; --muted:#5a6775; --line:#d3dae3; --line-2:#e4e9ef;
  --rail:#0f2236; --rail-2:#16304a; --rail-ink:#c4d2e1; --rail-dim:#7f93a8;
  --accent:#0a6f8c; --accent-ink:#ffffff; --accent-soft:#e0eff4;
  --signal:#c4352a; --ok:#1c7a4b; --warn:#a4620a; --cave:#fde8e6; --cave-ink:#9b2219;
  --t-red:#d63a2f; --t-orange:#ec8622; --t-yellow:#e4bd1c; --t-green:#2f9a55; --t-blue:#2f6fd1;
  --bub:#eef2f6; --me:#0a6f8c; --me-ink:#ffffff;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-doc:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1219; --panel:#131b24; --panel-2:#18222d; --ink:#e1e7ee; --muted:#93a1b0; --line:#253140; --line-2:#1d2834;
  --rail:#08131e; --rail-2:#142a40; --rail-ink:#b3c3d4; --rail-dim:#6d8299;
  --accent:#4cb2cf; --accent-ink:#06202a; --accent-soft:#11303a;
  --signal:#ff7b6c; --ok:#5fcf97; --warn:#efb257; --cave:#3a1714; --cave-ink:#ffb3a9;
  --bub:#1a2430; --me:#1d5d71; --me-ink:#eaf6fa; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1219; --panel:#131b24; --panel-2:#18222d; --ink:#e1e7ee; --muted:#93a1b0; --line:#253140; --line-2:#1d2834;
  --rail:#08131e; --rail-2:#142a40; --rail-ink:#b3c3d4; --rail-dim:#6d8299;
  --accent:#4cb2cf; --accent-ink:#06202a; --accent-soft:#11303a;
  --signal:#ff7b6c; --ok:#5fcf97; --warn:#efb257; --cave:#3a1714; --cave-ink:#ffb3a9;
  --bub:#1a2430; --me:#1d5d71; --me-ink:#eaf6fa; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;line-height:1.25;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:14px 10px calc(env(safe-area-inset-bottom,0px) + 12px) max(10px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid var(--rail-2);margin-bottom:10px;background:none;border-top:0;border-left:0;border-right:0;cursor:pointer;text-align:left;color:inherit}
.brand .logo{width:32px;height:32px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:13px;font-family:var(--f-mono)}
.brand b{display:block;color:#fff;font-size:14px}
.brand small{display:block;color:var(--rail-dim);font-size:11.5px}
.nav{display:grid;gap:2px}
.nav .sec{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--rail-dim);padding:12px 10px 4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;color:var(--rail-ink);cursor:pointer;font-size:13.5px}
.nav button:hover:not(:disabled){background:var(--rail-2)}
.nav button.on{background:var(--rail-2);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav button:disabled{opacity:.38;cursor:default}
.nav .n{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--rail-dim)}
.nav .done .n{color:#7fd3a6}
.rail-foot{margin-top:auto;display:grid;gap:8px;border-top:1px solid var(--rail-2);padding-top:12px}
.who{display:flex;gap:10px;align-items:center;padding:0 6px}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--rail-2);display:grid;place-items:center;font-size:12px;color:#fff}
.who b{display:block;color:#fff;font-size:13px;font-weight:500}
.who small{color:var(--rail-dim);font-size:11.5px}
.stat{display:flex;align-items:center;gap:8px;background:var(--rail-2);border:0;border-radius:6px;padding:8px 10px;color:var(--rail-ink);cursor:pointer;font-size:12.5px;text-align:left;width:100%}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rail-dim);flex:none}
.dot.ok{background:#4fd18f}.dot.bad{background:#ff7b6c}.dot.wait{background:#efb257}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;min-height:52px;
  padding-block:8px;padding-left:20px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--ink);font-weight:600}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
.tbtn:hover{border-color:var(--muted)}
.tbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.timer{font-family:var(--f-mono);font-size:15px;font-weight:500;padding:5px 10px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);display:flex;gap:8px;align-items:center}
.timer small{font-family:var(--f-ui);font-size:11px;color:var(--muted)}
.timer.low{color:var(--warn)}.timer.over{color:var(--signal);border-color:var(--signal)}

/* Patient header */
.pt{background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px;padding-left:20px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.pt .pav{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600}
.pt h2{font-size:18px}
.pt .meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:2px}
.pt .meta span b{color:var(--ink);font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:3px 8px;background:var(--panel-2);white-space:nowrap}
.chip.cave{background:var(--cave);color:var(--cave-ink);border-color:transparent;font-weight:600}
.tri{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.tri.rot{background:var(--t-red)}.tri.orange{background:var(--t-orange)}.tri.gelb{background:var(--t-yellow)}.tri.gruen{background:var(--t-green)}.tri.blau{background:var(--t-blue)}

#app{padding-block:20px 48px;padding-left:20px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px}
.btn{border:0;border-radius:6px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:13.5px;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.quiet{background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h3{font-size:14px}
.card-b{padding:12px 14px}
.notice{border:1px solid var(--warn);border-left-width:4px;background:var(--panel);padding:10px 14px;border-radius:6px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:16px}
.notice b{color:var(--warn)}
.hint{font-size:12.5px;color:var(--muted)}

/* Worklist */
.wl-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.wl-head h1{font-size:22px}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:12.5px;color:var(--muted)}
.kpi b{font-family:var(--f-mono);color:var(--ink);font-size:15px;margin-right:6px}
.exam{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:16px}
.exam div{padding:12px 14px;border-left:1px solid var(--line)}
.exam div:first-child{border-left:0}
.exam b{display:block;font-size:13.5px}
.exam small{color:var(--muted);font-size:12.5px}
.exam .mono{color:var(--accent);font-size:12px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--panel-2);border-top:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel-2)}
tbody tr.active{background:var(--accent-soft)}
td.sym{white-space:normal;min-width:220px}
.status{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.status.act{border-color:var(--accent);color:var(--accent);font-weight:600}
.status.fin{border-color:var(--ok);color:var(--ok)}

/* Module layout */
.mod{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.side{display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px)}
.side textarea{width:100%;min-height:200px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--panel-2);font-size:13px;line-height:1.5}
.checks{display:grid;gap:3px;font-size:13px}
.checks label{display:flex;gap:8px;align-items:center;cursor:pointer}
.chat{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:480px}
.log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--panel-2)}
.msg{max-width:min(80%,660px);display:grid;gap:3px}
.msg .mh{font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.msg .mh b{color:var(--ink);font-weight:600}
.msg .tx{padding:9px 12px;border-radius:8px;white-space:pre-wrap;word-wrap:break-word;background:var(--panel);border:1px solid var(--line)}
.msg.me{align-self:flex-end}
.msg.me .mh{justify-content:flex-end}
.msg.me .tx{background:var(--me);color:var(--me-ink);border-color:transparent}
.msg.think .tx{color:var(--muted);font-style:italic}
.say{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 2px;font-size:12px}
.compose{border-top:1px solid var(--line);padding:10px 12px;display:grid;gap:8px;background:var(--panel)}
.crow{display:flex;gap:8px;align-items:flex-end}
.crow textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--panel-2);max-height:180px;min-height:46px}
.mic{--lvl:0;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;flex:none;position:relative;transition:box-shadow .08s}
.mic svg{width:20px;height:20px}
.mic.on{background:var(--signal);border-color:var(--signal);color:#fff;box-shadow:0 0 0 calc(3px + var(--lvl) * 12px) color-mix(in srgb,var(--signal) 22%,transparent)}
.mic.busy{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.mic.busy::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent;border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.mic.busy::after{animation:none}.mic{transition:none}}
.cmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.micstat{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0}
.micstat.rec{color:var(--signal);font-weight:500}.micstat.busy{color:var(--accent)}.micstat.err{color:var(--warn)}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tog{font-size:12px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;cursor:pointer}
.tog[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);align-items:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Roleplay animations */
.persona{display:flex;align-items:center;gap:12px;min-width:0}
.pav2{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;position:relative;flex:none;transition:background .2s,color .2s}
.pinfo{display:grid;min-width:0}
.pinfo h3{font-size:15px}
.pstate{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.wave{display:flex;gap:3px;align-items:center;height:20px;margin-left:4px}
.wave i{width:3px;height:4px;border-radius:2px;background:var(--accent);opacity:.3;transition:opacity .2s}
.persona[data-state="speaking"] .pav2::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--accent);animation:ring 1.4s ease-out infinite}
.persona[data-state="speaking"] .wave i{opacity:1;animation:wave .9s ease-in-out infinite}
.persona[data-state="speaking"] .pstate{color:var(--accent)}
.persona[data-state="listening"] .pav2{background:color-mix(in srgb,var(--signal) 14%,var(--panel));color:var(--signal)}
.persona[data-state="listening"] .wave i{background:var(--signal);opacity:1;animation:wave 1.6s ease-in-out infinite}
.persona[data-state="listening"] .pstate{color:var(--signal)}
.persona[data-state="thinking"] .pstate{color:var(--accent)}
.wave i:nth-child(2){animation-delay:.12s!important}.wave i:nth-child(3){animation-delay:.24s!important}.wave i:nth-child(4){animation-delay:.36s!important}.wave i:nth-child(5){animation-delay:.48s!important}
@keyframes wave{0%,100%{height:4px}50%{height:18px}}
@keyframes ring{from{transform:scale(.92);opacity:.9}to{transform:scale(1.35);opacity:0}}
.dots{display:inline-flex;gap:4px;align-items:center;height:1em}
.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.4;animation:dot 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-4px);opacity:1}}
.msg.new{animation:msgIn .32s cubic-bezier(.2,.8,.3,1)}
.msg.me.new{animation-name:msgInMe}
@keyframes msgIn{from{opacity:.15;transform:translate(-10px,6px) scale(.98)}}
@keyframes msgInMe{from{opacity:.15;transform:translate(10px,6px) scale(.98)}}
.msg.speaking .tx{box-shadow:0 0 0 2px var(--accent-soft),0 0 0 3px var(--accent)}
.wrap.enter{animation:modIn .28s ease-out}
@keyframes modIn{from{opacity:.4;transform:translateY(6px)}}
tbody tr{transition:background .15s}
.btn,.tbtn,.tog{transition:filter .15s,transform .1s}
.btn:active:not(:disabled),.tog:active{transform:scale(.97)}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.persona[data-state="idle"] .pav2{animation:breathe 3s ease-in-out infinite}
.persona[data-state="idle"] .wave i{animation:idlewave 2.4s ease-in-out infinite;opacity:.45}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 0%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 18%,transparent)}}
@keyframes idlewave{0%,100%{height:4px}50%{height:8px}}
@keyframes fadeOnly{from{opacity:.1}}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){
 .msg.new,.msg.me.new,.wrap.enter{animation:fadeOnly .4s ease-out!important}
 .dots i{animation:blink 1.1s infinite!important;transform:none!important}
 .persona .wave i{animation:none!important}
 .persona[data-state="speaking"] .wave i,.persona[data-state="listening"] .wave i{height:12px;animation:blink 1s infinite!important}
 .persona[data-state="speaking"] .pav2::after{animation:blink 1.4s infinite!important;transform:none}
 .persona[data-state="idle"] .pav2{animation:none}
 .btn:active,.tog:active{transform:none}}

.start{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px 24px;padding:18px;margin-bottom:16px;border-color:var(--accent);align-items:center}
.start-t h2{font-size:18px;margin:4px 0 6px}
.start-t p{margin:0;max-width:62ch}
.start-a{grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.start-a .btn{font-size:15px;padding:11px 18px}
.start-demo{display:grid;gap:8px;background:var(--panel-2);border-radius:8px;padding:12px}
.dm{display:flex;gap:8px;align-items:flex-end;animation:msgIn .5s cubic-bezier(.2,.8,.3,1) both}
.dm:nth-child(2){animation-delay:.6s}.dm:nth-child(3){animation-delay:1.2s}
.dm.me{justify-content:flex-end;animation-name:msgInMe}
.dav{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.dtx{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.dm.me .dtx{background:var(--me);color:var(--me-ink);border-color:transparent}
@media (max-width:860px){.start{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.dm{animation:fadeOnly .4s both!important}}

.rp-banner{background:var(--accent);color:var(--accent-ink);padding:8px 14px;font-size:13px;border-radius:8px 8px 0 0}
.rp-banner b{font-weight:600}

/* Document */
.doc-tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.doc-tb .grow{flex:1}
.doc{padding:24px clamp(16px,4vw,40px);font-family:var(--f-doc)}
.doc-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px;font-family:var(--f-ui)}
.doc-head h2{font-size:20px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px}
.field.wide{grid-column:1/-1}
.field label{display:block;font-family:var(--f-ui);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.field label small{text-transform:none;letter-spacing:0;font-weight:400;margin-left:6px}
.field textarea{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;resize:vertical;min-height:40px;padding:3px 0 6px;font-family:var(--f-doc);font-size:15.5px;line-height:1.55}
.field textarea:focus{outline:none;border-bottom-color:var(--accent)}

/* Results */
.res-top{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;padding:18px}
.score{font-size:52px;font-weight:600;line-height:1;font-family:var(--f-mono)}
.score small{font-size:16px;color:var(--muted)}
.verdict{font-weight:600;font-size:16px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--signal)}
.res-parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.rp{padding:14px;display:grid;gap:8px;align-content:start}
.rp h3{font-size:15px}
.meter{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent)}
.meter.low span{background:var(--signal)}
.rp ul{margin:0;padding-left:18px;font-size:13.5px;display:grid;gap:3px}
.rp h4{margin:4px 0 0;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
td.wrong{color:var(--signal);text-decoration:line-through;text-decoration-thickness:1px;white-space:normal}
td.right{color:var(--ok);white-space:normal}
td.why{white-space:normal}
details.box{margin-top:12px}
details.box>summary{cursor:pointer;font-weight:600;padding:10px 14px}
details.box>div{padding:0 14px 14px}
.dl{display:grid;grid-template-columns:220px minmax(0,1fr);gap:6px 16px;font-size:13.5px}
.dl dt{font-weight:600}
.dl dd{margin:0;white-space:pre-wrap}
.transcript{font-size:13px;white-space:pre-wrap;margin-top:6px;max-height:360px;overflow:auto;background:var(--panel-2);padding:10px;border-radius:6px}

/* Drawers */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:20;overflow-y:auto;box-shadow:-10px 0 30px rgba(0,0,0,.15);
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) 18px}
.drawer-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.drawer-h h2{font-size:17px}
.drawer input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);margin:8px 0}
.gl{display:grid;grid-template-columns:1fr 1fr;font-size:13px}
.gl div{padding:6px 4px;border-top:1px solid var(--line-2)}
.gl .f{font-weight:600}
.set{display:grid;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.set>h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.set p{margin:0;font-size:13.5px}
.opt{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;gap:10px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt label.r{display:grid;grid-template-columns:auto 1fr;gap:10px;cursor:pointer;align-items:start}
.opt label.r input{margin-top:3px}
.opt label.r b{display:block;font-size:13.5px}
.opt label.r small{display:block;color:var(--muted);font-size:12.5px}
.opt-x{display:grid;gap:8px}
.opt-x select,.opt-x input[type=password],.opt-x textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.cb{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.cb input{margin-top:3px}
.warnline{color:var(--warn);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 14px;border-radius:6px;z-index:30;font-size:13.5px;max-width:min(600px,calc(100% - 32px));display:flex;gap:12px;align-items:center}
.toast button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:5px 10px;cursor:pointer;font-weight:600;white-space:nowrap}

@media (max-width:1100px){.mod{grid-template-columns:minmax(0,1fr)}.side{position:static}.res-parts{grid-template-columns:1fr}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));overflow-x:auto}
  .brand{border:0;margin:0;padding:0 6px 0 0}.brand span.t{display:none}
  .nav{display:flex;gap:2px}.nav .sec{display:none}.nav button{padding:7px 9px;white-space:nowrap}.nav button .lab{display:inline}.nav .n{margin-left:4px}
  .rail-foot{margin:0 0 0 auto;border:0;padding:0;display:flex}.who{display:none}.stat .lab{display:none}
  .top{top:0;padding-left:max(16px,env(safe-area-inset-left,0px))}
  .pt,#app{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .exam{grid-template-columns:1fr}.exam div{border-left:0;border-top:1px solid var(--line)}.exam div:first-child{border-top:0}
  .fields{grid-template-columns:1fr}
  .chat{height:74vh}
  .msg{max-width:90%}
  .dl{grid-template-columns:1fr}.dl dd{margin-bottom:8px}
  .chips{margin-left:0}
  .top .tbtn .lab{display:none}
}

function patientRules(c){const p=c.p;return `You are role-playing a PATIENT in the German Fachsprachprüfung (FSP) of the Ärztekammer Berlin, part 1 (Arzt-Patienten-Gespräch). The user is an international doctor taking your medical history in German. Stay fully in character. The user's messages may come from speech recognition, so ignore small transcription errors and missing punctuation.

RULES
- Reply ONLY in German, as a real patient speaks: everyday language, 1–3 short sentences. No lists, no markdown, no asterisks, no stage directions, no emojis.
- Never use medical terminology yourself. If the doctor uses a medical term an ordinary German layperson would not know (e.g. Dyspnoe, Miktion, Hypertonie, Noxen, Allergene, Analgetika), say you don't understand and ask what it means.
- Reveal only what is asked. Don't volunteer the whole story. A vague question gets a vague answer; a precise question gets a precise answer.
- If the doctor's German is unclear or confusing, say so naturally ("Wie bitte? Das hab ich nicht verstanden.").
- Facts missing from the file: invent plausible, unremarkable, consistent details.
- Personality: ${c.persona}.
- When the doctor signals the history is finished or explains what happens next, ask your questions (below) one at a time. If the answer contains jargon, ask what it means.
- You don't know your diagnosis. Never break character, never give hints, scores or feedback, never mention the exam.

PATIENT FILE (secret)
Name: ${p.name}, ${p.sex==="w"?"female":"male"}, born ${p.geb} (${p.alter} years), height ${p.groesse}, weight ${p.gewicht}, job: ${p.beruf}. Setting: ${c.setting}. Today is ${new Date().toLocaleDateString("de-DE")}.
${factsText(c)}

YOUR QUESTIONS AT THE END
${c.fragen.map(q=>"- "+q).join("\n")}`;}
function briefText(){return BRIEF.map(([k,l])=>S.brief[k]?l+": "+S.brief[k]:"").filter(Boolean).join("\n");}
function transcript(turns,them){return turns.map(t=>(t.role==="user"?"Kandidat: ":them+": ")+t.content).join("\n");}
function cap(t){const n=provider==="chrome"?2500:provider==="webllm"?5000:1e9;return t.length>n?"…"+t.slice(-n):t}
function oaRules(c){return `You are Oberärztin Dr. Weber, a senior physician examining a candidate in the German Fachsprachprüfung (FSP) of the Ärztekammer Berlin, part 3 (Arzt-Arzt-Gespräch). The user is the candidate (assistant doctor) who took the history of the patient below and wrote a documentation. The user's messages may come from speech recognition; ignore small transcription errors.

HOW TO RUN IT
- Always German, professional medical register, 1–3 sentences per turn. No lists, no markdown, no asterisks.
- Phase 1: let the candidate present the patient (Patientenvorstellung). If their message is only a greeting, ask them to present. Do not interrupt a presentation.
- Phase 2: then ask exactly ONE question per turn, like a real Oberärztin. Mix: missing or unclear anamnesis details (compare with the true file and point at real gaps), Verdachtsdiagnose with justification, Differenzialdiagnosen, next diagnostic steps, therapy, and Fachsprache checks (ask what a term means in Laiensprache, the Fachbegriff for a lay word, or how they would explain a procedure to the patient).
- If the candidate says something medically wrong, correct it briefly and move on.
- After about 8–10 questions, or when the candidate asks to finish, close politely with "Vielen Dank, das war's." Never give scores or exam feedback.

TRUE PATIENT FILE
${c.p.name}, ${c.p.alter} J., ${c.p.sex==="w"?"weiblich":"männlich"}, ${c.p.beruf}. ${c.setting}.
${factsText(c)}
Lösung: VD ${c.l.vd}. DD ${c.l.dd}. Diagnostik ${c.l.dx}. Therapie ${c.l.tx}.

CANDIDATE'S DOCUMENTATION
${briefText()||"(leer)"}`;}
function evalPrompt(c){return `You are an examiner of the German Fachsprachprüfung (FSP) at the Ärztekammer Berlin. Evaluate the candidate's performance in all three parts against the true case. Judge MEDICAL-LANGUAGE COMPETENCE (C1 Fachsprache): completeness and structure of the Anamnese, appropriate lay language with the patient, correct Fachsprache in the documentation and with the colleague, grammar, clarity, and reasonable medical reasoning. Parts 1 and 3 may be speech-recognition transcripts: do not penalise punctuation or obvious transcription errors. Be strict but fair. Write all feedback in German, concise.

TRUE CASE
${c.p.name}, ${c.p.alter} J., ${c.p.sex}. ${c.leit}.
${factsText(c)}
Lösung: VD ${c.l.vd}. DD ${c.l.dd}. Diagnostik ${c.l.dx}. Therapie ${c.l.tx}.

PART 1 – TRANSCRIPT
${cap(transcript(S.t1,"Patient"))||"(leer)"}

PART 2 – DOCUMENTATION
${briefText()||"(leer)"}

PART 3 – TRANSCRIPT
${cap(transcript(S.t3,"Oberarzt"))||"(leer)"}

Reply with ONLY this JSON (no other text):
{"gesamt":0-100,"bestanden":true|false,"fazit":"2 Sätze",
"teile":[{"teil":"Arzt-Patienten-Gespräch","punkte":0-100,"staerken":["…"],"fehler":["…"],"fehlend":["nicht erfragte Punkte"]},
{"teil":"Dokumentation","punkte":0-100,"staerken":["…"],"fehler":["…"],"fehlend":["…"]},
{"teil":"Arzt-Arzt-Gespräch","punkte":0-100,"staerken":["…"],"fehler":["…"],"fehlend":["…"]}],
"sprache":[{"original":"exakter Satz des Kandidaten","korrektur":"korrigierter Satz","erklaerung":"kurze Regel"}],
"tipps":["3 konkrete Übungstipps"]}
Rules: up to 4 items per list; up to 8 "sprache" items taken verbatim from the candidate's own words; an empty or nearly empty part scores below 20; "bestanden" is true only if every part scores at least 60.`;}
