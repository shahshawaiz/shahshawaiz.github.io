  document.addEventListener('DOMContentLoaded', () => {
    let currentLang = localStorage.getItem('lang') || 'de';
    let currentTheme = localStorage.getItem('theme') || 'dark';

    // --- REFACTORED THEME LOGIC ---
    const themeToggleBtn = document.getElementById('themeToggle');

    function applyTheme(theme) {
      currentTheme = theme;
      document.body.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      themeToggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    themeToggleBtn.addEventListener('click', () => {
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      applyTheme(newTheme);
    });
    // --- END REFACTORED THEME LOGIC ---

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      const t = translations[lang];

      // --- Meta & Core HTML ---
      document.documentElement.lang = lang;
      document.querySelector('title').textContent = t.title;
      document.querySelector('meta[name="description"]').content = t.description;
      // ... (rest of the setLanguage function is the same)
      document.querySelector('meta[property="og:title"]').content = t.ogTitle;
      document.querySelector('meta[property="og:description"]').content = t.ogDescription;
      const baseUrl = `https://shawaiz.de/${lang}/`;
      document.querySelector('meta[property="og:url"]').content = baseUrl;
      document.querySelector('link[rel="canonical"]').href = baseUrl;
      document.querySelector('#langToggle').textContent = lang === 'de' ? '🇬🇧' : '🇩🇪';
      document.querySelector('footer').innerHTML = `© ${new Date().getFullYear()} Shawaiz Shah. ${t.footerText}`;

      // --- Navigation ---
      document.querySelectorAll('nav ul a').forEach((link, i) => {
        link.textContent = t.nav[i];
      });

      // --- Page Sections ---
      document.querySelector('#projects-title').textContent = t.projectsTitle;
      document.querySelector('#projects .subtitle').textContent = t.projectsSubtitle;
      document.querySelector('#about-title').innerHTML = t.aboutTitle;
      document.querySelector('#about .subtitle').innerHTML = t.aboutSubtitle;
      document.querySelector('.cta a.fill').textContent = t.emailMe;
      document.querySelector('#experience-title').textContent = t.experienceTitle;
      document.querySelector('#skills-title').textContent = t.skillsTitle;
      document.querySelector('#contact-title').textContent = t.contactTitle;
      document.querySelector('#addressLocation').textContent = t.addressLocation;

      // --- Skills Details ---
      document.querySelectorAll('#skills details').forEach((detail, i) => {
        detail.querySelector('summary').textContent = t.skillsSummaries[i];
        detail.querySelector('p').textContent = t.skillsDetails[i];
      });
      
      // --- Schema Data ---
      document.getElementById('schemaPerson').textContent = JSON.stringify(t.schemaPerson);
      document.getElementById('schemaWebsite').textContent = JSON.stringify(t.schemaWebsite);
      document.getElementById('schemaBreadcrumbs').textContent = JSON.stringify(t.schemaBreadcrumbs);
      
      // --- Re-render dynamic content ---
      renderFilters();
      renderProjects();
      renderExperience();
    }

    // --- (The rest of the script is largely the same, just calling the new functions) ---
    document.getElementById('langToggle').addEventListener('click', () => {
      setLanguage(currentLang === 'de' ? 'en' : 'de');
    });

    const filtersEl = document.getElementById('filters');
    const projectsGrid = document.getElementById('projectsGrid');
    let activeTag = '__all';

    function renderFilters() { /* ... unchanged ... */ 
      const tags = [...new Set(translations[currentLang].projectsData.flatMap(p => p.tags || []))];
      filtersEl.innerHTML = `<button class="filter-btn active" data-tag="__all">${translations[currentLang].allProjects}</button>` +
        tags.map(t => `<button class="filter-btn" data-tag="${t}">${t}</button>`).join('');
      filtersEl.addEventListener('click', e => {
        const b = e.target.closest('button'); if(!b) return;
        document.querySelectorAll('#filters .filter-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active'); activeTag = b.dataset.tag; renderProjects();
      });
    }

    function renderProjects() { /* ... unchanged ... */ 
      const projects = translations[currentLang].projectsData;
      const filtered = projects.filter(p => activeTag === '__all' || (p.tags||[]).includes(activeTag));
      projectsGrid.innerHTML = filtered.map(p => cardTemplate(p, projects.indexOf(p))).join('');
      document.querySelectorAll('.grid .card').forEach(el => observer.observe(el));
    }
    
    function cardTemplate(p, idx) { /* ... unchanged ... */
      const t = translations[currentLang];
      return `<article class="card" data-idx="${idx}" data-tags='${JSON.stringify(p.tags||[])}' itemscope itemtype="https://schema.org/CreativeWork">
        <div class="thumb"><img loading="lazy" src="${p.img}" alt="${p.title}" itemprop="image"></div>
        <div class="card-body">
          <h3 itemprop="name">${p.title}</h3>
          <p itemprop="description">${p.short}</p>
          <div class="mini-tags">${(p.tags||[]).map(tag => `<span>${tag}</span>`).join('')}</div>
          <button class="learn" aria-label="${t.learnMoreAria} ${p.title}">${t.learnMore}</button>
        </div>
      </article>`;
    }

    function renderExperience() { /* ... unchanged ... */ 
      const experience = translations[currentLang].experienceData;
      const tl = document.getElementById('experienceTl');
      tl.innerHTML = experience.map(e => `<div class="tl-item">
        <div class="tl-card" itemscope itemtype="https://schema.org/Person">
          <h3 itemprop="jobTitle">${e.role} – ${e.company}</h3>
          <span class="muted" itemprop="description">${e.period} · ${e.location}</span>
          <p class="muted" style="margin-top:.5rem;" itemprop="description">${e.desc}</p>
          ${(e.tags||[]).length ? '<div class="mini-tags" style="margin-top:.6rem;">' + e.tags.map(t=>`<span>${t}</span>`).join('') + '</div>' : ''}
        </div>
      </div>`).join('');
      document.querySelectorAll('.tl-item').forEach(el => observer.observe(el));
    }

    const observer = new IntersectionObserver((entries)=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('visible');observer.unobserve(entry.target);}});},{threshold:0.1});

    // --- Modal logic (unchanged) ---
    const modal = document.getElementById('modal');
    // ...
    function openModal(project){
      const t = translations[currentLang];
      modal.querySelector('#modalTitle').textContent = project.title;
      modal.querySelector('#modalDesc').textContent = project.short;
      const modalImg = modal.querySelector('#modalImg');
      modalImg.src = project.img;
      modalImg.alt = `${project.title} ${t.screenshotAlt}`;
      modal.querySelector('#modalBody').innerHTML = project.body || '';
      modal.querySelector('#modalLinks').innerHTML = (project.links||[]).map(l => `<a class="btn" href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join('');
      modal.style.display='flex';
    }
    document.addEventListener('click', e => {
      if (e.target.classList.contains('learn')){
        const card = e.target.closest('.card');
        const idx = +card.dataset.idx;
        const projectData = translations[currentLang].projectsData[idx];
        openModal(projectData);
      }
    });
    document.getElementById('modalClose').addEventListener('click',()=>modal.style.display='none');
    modal.addEventListener('click',e=>{if(e.target===modal) modal.style.display='none';});

    // --- Other observers and helpers (unchanged) ---
    const topBtn=document.getElementById('backTop');
    window.addEventListener('scroll',()=>{topBtn.style.display=window.scrollY>900?'block':'none';});
    topBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

    const navLinks=document.querySelectorAll('nav a[href^="#"]');
    const sections=[...navLinks].map(a=>document.querySelector(a.getAttribute('href'))).filter(Boolean);
    const navObserver = new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){navLinks.forEach(l=>l.classList.remove('active'));const l=document.querySelector(`nav a[href="#${entry.target.id}"]`);if(l) l.classList.add('active');}});},{threshold:0.5});
    sections.forEach(s=>navObserver.observe(s));
    
    // --- PARTICLE BACKGROUND (unchanged) ---
    const canvas = document.getElementById('particles');
    if(canvas){
        const ctx = canvas.getContext('2d'); let w,h,particles=[];
        function resize(){w=canvas.width=window.innerWidth;h=canvas.height=document.querySelector('#about').offsetHeight;}
        window.addEventListener('resize',resize);resize();
        function createParticles(){particles=[];for(let i=0;i<120;i++){particles.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.6,vy:(Math.random()-.5)*.6,r:Math.random()*2+0.5});}}
        createParticles();
        function draw(){ctx.clearRect(0,0,w,h);ctx.fillStyle='rgba(255,255,255,.8)';particles.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;});requestAnimationFrame(draw);}draw();
    }
    
    // --- INITIALIZATION ---
    applyTheme(currentTheme); // Set initial theme
    setLanguage(currentLang); // Set initial language
  });
})();
